<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="heb_words.js"></script>
    <script>
      // Create a separate local dictionary in localStorage if it doesn't exist
      if (!localStorage.getItem('localHebWords')) {
        localStorage.setItem('localHebWords', '{}');
      }
    </script>
    <style>
      body {
        font-family: sans-serif;
      }
      #canvas {
        position: absolute;
        border: solid 1px #000000;
      }
      .letter {
        display: block;
        position: absolute;
        cursor: pointer;
        user-select: none;
        border-radius: 2em;
        width: 1.5em;
        height: 1.5em;
        line-height: 1.5em;
        text-align: center;
      }
      .letter:active,
      .letter.selected {
        background-color: #aaaaff;
      }

      #scoreContainer {
        direction: rtl;
        position: absolute;
        top: 20px;
        left: 184px;
        width: 7em;
        height: 2em;
      }

      #solutionContainer {
        position: absolute;
        top: 30px;
        left: 200px;
        direction: ltr;
        text-align: right;
        padding: 0.5em;
        width: 5em;
        height: 20em;
        border: solid 1px #000;
      }
      #solutionContainer li {
        list-style: none;
        color: #0a0;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="100" height="100"></canvas>
    <div id="scoreContainer">נקודות: 0</div>
    <ul id="solutionContainer"></ul>
  </body>
  <script>
    const letterSpacing = 30,
      boxTopOffset = 60,
      boxLeftOffset = 60,
      canvasX = 50,
      canvasY = 50;

    const canvas = document.getElementById('canvas');
    canvas.style.top = `${canvasY}px`;
    canvas.style.left = `${canvasX}px`;
    const ctx = canvas.getContext('2d');

    const topLetters = ['ב', 'ה', 'א'],
      leftLetters = ['ד', 'נ', 'מ'],
      bottomLetters = ['צ', 'ר', 'ש'],
      rightLetters = ['ע', 'ר', 'י'];

    leftLetters.forEach((letter, i) => {
      const e = document.createElement('div');
      e.classList.add('left');
      e.classList.add('letter');
      e.innerText = letter;
      e.style.left = '25px';
      e.style.top = `${boxTopOffset + i * letterSpacing}px`;
      document.body.appendChild(e);
    });

    rightLetters.forEach((letter, i) => {
      const e = document.createElement('div');
      e.classList.add('right');
      e.classList.add('letter');
      e.innerText = letter;
      e.style.left = '155px';
      e.style.top = `${boxTopOffset + i * letterSpacing}px`;
      document.body.appendChild(e);
    });

    topLetters.forEach((letter, i) => {
      const e = document.createElement('div');
      e.classList.add('top');
      e.classList.add('letter');
      e.innerText = letter;
      e.style.left = `${boxLeftOffset + i * letterSpacing}px`;
      e.style.top = '25px';
      document.body.appendChild(e);
    });

    bottomLetters.forEach((letter, i) => {
      const e = document.createElement('div');
      e.classList.add('bottom');
      e.classList.add('letter');
      e.innerText = letter;
      e.style.left = `${boxLeftOffset + i * letterSpacing}px`;
      e.style.top = '155px';
      document.body.appendChild(e);
    });

    var inSelection = false;
    var selectedLetters = [];
    var lastSelectedSet = '';
    document.addEventListener('mouseup', (e) => {
      inSelection = false;
      checkWord(selectedLetters.join(''));
      selectedLetters = [];
      ctx.reset();
      document.querySelectorAll('.letter').forEach((l) => {
        l.classList.remove('selected');
      });
    });
    document.querySelectorAll('.letter').forEach((l) => {
      l.addEventListener('mousedown', (e) => {
        inSelection = true;
        lastSelectedSet = e.target.classList.value.split(' ')[0];
        e.target.classList.add('selected');
        selectedLetters.push(e.target.innerText);
        const [x, y] = getCoordinatesForLetter(e.target);
        ctx.moveTo(x, y);
      });

      l.addEventListener('mouseover', (e) => {
        currentSelectedSet = e.target.classList.value.split(' ')[0];
        if (
          inSelection &&
          lastSelectedSet !== currentSelectedSet &&
          !e.target.classList.contains('selected')
        ) {
          lastSelectedSet = currentSelectedSet;
          e.target.classList.add('selected');
          selectedLetters.push(e.target.innerText);
          const [x, y] = getCoordinatesForLetter(e.target);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.moveTo(x, y);
        }
      });
    });

    function getCoordinatesForLetter(e) {
      let x = e.offsetLeft + e.offsetWidth / 2 - 50,
        y = e.offsetTop + e.offsetHeight / 2 - 50;
      if (e.classList.contains('left')) {
        x += 13;
      }
      if (e.classList.contains('right')) {
        x -= 17;
      }
      if (e.classList.contains('top')) {
        y += 13;
      }
      if (e.classList.contains('bottom')) {
        y -= 17;
      }
      return [x, y];
    }

    var score = 0;
    function wordExists(word) {
      // Check if the word exists in the local dictionary
      try {
        const localWords = JSON.parse(localStorage.getItem('localHebWords'));
        return localWords[word] === 1 || heb_words[word] === 1;
      }
      catch (e) {
        console.error('Error parsing localHebWords:', e);
        return false;
      }
    }

    function checkWord(rawWord) {
      if(!rawWord) return;
      const word = convertLastLetterToFinal(rawWord);
      console.log(word);
      const solutionContainer = document.getElementById('solutionContainer');
      if (
        wordExists(word) ||
        wordExists(word + 'ים') ||
        wordExists(word + 'ות') ||
        wordExists(word + 'ים') ||
        wordExists(word + 'ון') 
      ) {
        console.log('Word found: ' + word);
        if (solutionContainer.innerText.includes(word)) {
          console.log('Word already found: ' + word);
          toastMessage('המילה כבר נמצאה: ' + word);
        } else {
          const e = document.createElement('li');
          e.innerText = word;
          solutionContainer.appendChild(e);
          score += word.length;
          scoreContainer.innerText = `נקודות: ${score}`;
        }
      }
      else {
        console.log('Word not found: ' + word);
        toastMessageWithYesNoAction(
          `המילה לא נמצאה: ${word}
          להוסיף למילון?`,
          () => {
            addToDictionary(word);
            const e = document.createElement('li');
            e.innerText = word;
            e.style.color = '#88f';
            solutionContainer.appendChild(e);
          },
          () => {
            console.log('User chose not to add the word');
          }
        );
      }
    }

    function convertLastLetterToFinal(word) {
      const lastLetter = word[word.length - 1];
      if (lastLetter === 'מ') {
        word = word.slice(0, -1) + 'ם';
      } else if (lastLetter === 'נ') {
        word = word.slice(0, -1) + 'ן';
      } else if (lastLetter === 'פ') {
        word = word.slice(0, -1) + 'ף';
      } else if (lastLetter === 'צ') {
        word = word.slice(0, -1) + 'ץ';
      }
      else if (lastLetter === 'כ') {
        word = word.slice(0, -1) + 'ך';
      }
      return word;
    }

    function toastMessage(msg) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.position = 'fixed';
      toast.style.top = '10px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.backgroundColor = '#000';
      toast.style.color = '#fff';
      toast.style.padding = '10px';
      toast.style.borderRadius = '5px';
      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 2000);
    }

    function toastMessageWithYesNoAction(msg, yesAction, noAction) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.position = 'fixed';
      toast.style.top = '10px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.backgroundColor = '#000';
      toast.style.color = '#fff';
      toast.style.padding = '10px';
      toast.style.borderRadius = '5px';

      const yesButton = document.createElement('button');
      yesButton.innerText = 'כן';
      yesButton.onclick = () => {
        yesAction();
        document.body.removeChild(toast);
      };
      const noButton = document.createElement('button');
      noButton.innerText = 'לא';
      noButton.onclick = () => {
        noAction();
        document.body.removeChild(toast);
      };


      yesButton.style.background = '#2196f3';
      yesButton.style.color = '#fff';
      yesButton.style.border = 'none';
      yesButton.style.margin = '0 10px';
      yesButton.style.padding = '6px 18px';
      yesButton.style.borderRadius = '4px';
      yesButton.style.fontWeight = 'bold';
      yesButton.style.fontSize = '1em';
      yesButton.style.cursor = 'pointer';

      noButton.style.background = 'transparent';
      noButton.style.color = '#fff';
      noButton.style.border = '2px solid #fff';
      noButton.style.margin = '0 10px';
      noButton.style.padding = '6px 18px';
      noButton.style.borderRadius = '4px';
      noButton.style.fontWeight = 'bold';
      noButton.style.fontSize = '1em';
      noButton.style.cursor = 'pointer';

      const btnContainer = document.createElement('div');
      btnContainer.style.display = 'flex';
      btnContainer.style.justifyContent = 'center';
      btnContainer.style.marginTop = '12px';
      btnContainer.appendChild(yesButton);
      btnContainer.appendChild(noButton);

      toast.appendChild(document.createElement('br'));
      toast.appendChild(btnContainer);

      document.body.appendChild(toast);
    }

    function addToDictionary(word) {
      console.log('Adding word to dictionary:', word);
      localStorage.setItem(
        'localHebWords',
        JSON.stringify({
          ...JSON.parse(localStorage.getItem('localHebWords')),
          [word]: 1,
        })
      );
      toastMessage(`המילה ${word} נוספה למילון`);
    }
  </script>
</html>
