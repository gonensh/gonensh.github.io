<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Danny Go! Jump Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22143a;
    --sun:#ffd23f;
    --sky:#5cc6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#1b1030;
    background-image:radial-gradient(circle at 50% 0%,#3a2160 0%,#1b1030 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    overflow:hidden;touch-action:none;user-select:none;
  }
  #wrap{position:relative;width:100%;max-width:1000px;padding:8px}
  canvas{
    display:block;width:100%;height:auto;
    border-radius:18px;
    background:#5cc6ff;
    box-shadow:0 0 0 6px #22143a, 0 18px 40px rgba(0,0,0,.55);
    image-rendering:auto;
  }
  #pad{position:absolute;inset:8px;pointer-events:none;display:none}
  #pad.on{display:block}
  .btn{
    position:absolute;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;
    border-radius:999px;border:4px solid rgba(34,20,58,.55);
    background:rgba(255,255,255,.34);
    color:#22143a;font-size:26px;font-weight:700;font-family:inherit;
    backdrop-filter:blur(2px);
  }
  .btn:active{background:rgba(255,255,255,.65);transform:scale(.94)}
  #bL{left:3%;bottom:6%;width:15%;aspect-ratio:1}
  #bR{left:20%;bottom:6%;width:15%;aspect-ratio:1}
  #bJ{right:3%;bottom:6%;width:20%;aspect-ratio:1;font-size:18px}
  #sound{
    position:absolute;top:20px;right:22px;pointer-events:auto;
    width:44px;height:44px;border-radius:999px;border:3px solid rgba(34,20,58,.5);
    background:rgba(255,255,255,.5);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #linkBtn{
    position:absolute;top:20px;right:76px;pointer-events:auto;
    width:44px;height:44px;border-radius:999px;border:3px solid rgba(34,20,58,.5);
    background:rgba(255,255,255,.5);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #footerLink{
    margin-top:10px;text-align:center;color:rgba(255,255,255,.5);
    font-family:'Fredoka',sans-serif;font-size:13px;
  }
  #footerLink button{
    background:none;border:none;color:#ffd23f;text-decoration:underline;
    font-family:inherit;font-size:inherit;cursor:pointer;padding:4px;
  }
  .hidden{display:none !important}
  #linkModal, #ctlOverlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,10,35,.72);
    font-family:'Fredoka',sans-serif;
    padding:20px;
  }
  .card{
    background:#fff8ec;color:#2b1a45;border-radius:22px;
    border:4px solid #2b1a45;padding:26px 28px;max-width:340px;width:100%;
    text-align:center;position:relative;
  }
  .card h2{margin:0 0 4px;font-size:23px}
  .card p.sub{margin:0 0 14px;font-size:13.5px;color:#5c4a72;line-height:1.4}
  #linkClose{
    position:absolute;top:8px;right:12px;border:none;background:none;
    font-size:24px;color:#2b1a45;cursor:pointer;line-height:1;padding:6px;
  }
  #linkQR{width:180px;height:180px;border-radius:12px;border:3px solid #2b1a45;background:#fff;display:block;margin:0 auto}
  #linkCodeBox{font-size:42px;font-weight:700;letter-spacing:6px;color:#ff4d6d;margin:14px 0 6px}
  #linkUrl{font-size:11.5px;color:#8a7aa3;word-break:break-all;margin:8px 0}
  #linkStatus{font-size:14px;font-weight:600;margin:10px 0 4px;min-height:20px}
  #linkNewCode{
    margin-top:6px;border:2px solid #2b1a45;background:#ffe9a8;color:#2b1a45;
    border-radius:999px;padding:8px 18px;font-family:inherit;font-weight:600;
    font-size:13px;cursor:pointer;
  }
  #ctlOverlay{background:linear-gradient(180deg,#5cc6ff,#2f7de0);flex-direction:column}
  #ctlBack{
    position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;
    background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.6);
    color:#fff;border-radius:999px;padding:8px 14px;font-family:inherit;
    font-size:13px;cursor:pointer;
  }
  #ctlHeader{
    position:absolute;top:calc(64px + env(safe-area-inset-top));left:16px;right:16px;
    color:#fff;text-align:center;text-shadow:0 2px 0 rgba(43,26,69,.5);
  }
  #ctlHeader h1{margin:6px 0 4px;font-size:24px}
  #ctlStatus{font-size:14px;opacity:.95;min-height:18px;padding:0 20px}
  #ctlEntry{
    background:#fff8ec;border:4px solid #2b1a45;border-radius:22px;
    padding:22px 24px;text-align:center;color:#2b1a45;max-width:280px;width:100%;
  }
  #ctlCodeInput{
    width:100%;font-size:30px;letter-spacing:8px;text-align:center;
    text-transform:uppercase;padding:10px 0;border-radius:12px;
    border:3px solid #2b1a45;font-family:inherit;font-weight:700;margin:12px 0;
  }
  #ctlConnectBtn{
    width:100%;padding:12px;border-radius:999px;border:none;
    background:#41a3ff;color:#fff;font-family:inherit;font-weight:700;
    font-size:16px;cursor:pointer;
  }
  #ctlPad{position:absolute;inset:0;display:flex;pointer-events:none}
  .ctlZone{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:16px;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  .ctlBtn{
    pointer-events:auto;user-select:none;
    border-radius:999px;border:5px solid rgba(43,26,69,.6);
    background:rgba(255,255,255,.35);color:#fff;text-shadow:0 1px 0 rgba(43,26,69,.6);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:700;
  }
  .ctlBtn:active{background:rgba(255,255,255,.65)}
  #ctlLeft,#ctlRight{width:104px;height:104px;font-size:40px}
  #ctlJump{width:140px;height:140px;font-size:19px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="520"></canvas>
  <div id="pad" class="on">
    <button class="btn" id="bL" aria-label="Move left">◀</button>
    <button class="btn" id="bR" aria-label="Move right">▶</button>
    <button class="btn" id="bJ" aria-label="Jump">JUMP</button>
  </div>
  <button id="sound" aria-label="Toggle sound">🔊</button>
  <button id="linkBtn" aria-label="Play with a phone controller">📱</button>
</div>
<div id="footerLink">
  <button id="ctlModeBtn" type="button">📱 Use this device as a controller instead</button>
</div>

<div id="linkModal" class="hidden">
  <div class="card">
    <button id="linkClose" aria-label="Close">×</button>

    <button id="linkNewCode" type="button">Get a new code</button>
  </div>
</div>

<div id="ctlOverlay" class="hidden">
  <button id="ctlBack" type="button">← Back</button>
  <div id="ctlHeader">
    <h1>Danny Go Controller</h1>
    <div id="ctlStatus">Enter the code shown on the game screen</div>
  </div>
  <div id="ctlEntry">
    <p style="margin:0;font-weight:600">Room code</p>
    <input id="ctlCodeInput" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD">
    <button id="ctlConnectBtn" type="button">Connect</button>
  </div>
  <div id="ctlPad" class="hidden">
    <div class="ctlZone">
      <button class="ctlBtn" id="ctlLeft" aria-label="Move left">◀</button>
      <button class="ctlBtn" id="ctlRight" aria-label="Move right">▶</button>
    </div>
    <div class="ctlZone">
      <button class="ctlBtn" id="ctlJump" aria-label="Jump">JUMP</button>
    </div>
  </div>
</div>
<!-- Bundled libraries below (no CDN dependency). Only the actual phone-pairing
     handshake needs internet at runtime; the code itself is fully offline. -->

/* ============================================================
   LEVEL BUILDER
   ============================================================ */
function buildLevel(name, theme, width, fn){
  const grid = Array.from({length:ROWS}, () => new Array(width).fill(' '));
  const movers = [];
  const meta = { start:{c:2,r:9}, flag:{c:width-8,r:10}, checkpoints:[], spawns:[] };

  const set = (c,r,ch) => { if(r>=0 && r<ROWS && c>=0 && c<width) grid[r][c]=ch; };

  const api = {
    set,
    ground(c0,c1,top){ for(let c=c0;c<=c1;c++) for(let r=top;r<ROWS;r++) set(c,r,'='); },
    block(c0,c1,r0,r1){ for(let c=c0;c<=c1;c++) for(let r=r0;r<=r1;r++) set(c,r,'='); },
    plank(c0,c1,r){ for(let c=c0;c<=c1;c++) set(c,r,'-'); },
    cloud(c0,c1,r){ for(let c=c0;c<=c1;c++) set(c,r,'c'); },
    brick(c0,c1,r){ for(let c=c0;c<=c1;c++) set(c,r,'b'); },
    q(c,r){ set(c,r,'?'); },
    snack(c,r){ set(c,r,'!'); },
    stump(c,rTop){ set(c,rTop,'n'); set(c+1,rTop,'n');
                   for(let r=rTop+1;r<ROWS;r++){ set(c,r,'n'); set(c+1,r,'n'); } },
    stars(c0,c1,r){ for(let c=c0;c<=c1;c++) set(c,r,'o'); },
    star(c,r){ set(c,r,'o'); },
    lava(c0,c1,top){ for(let c=c0;c<=c1;c++) for(let r=top;r<ROWS;r++) set(c,r, r===top?'^':'~'); },
    stairs(c0,steps,dir,base){
      for(let i=0;i<steps;i++){
        const c = dir>0 ? c0+i : c0-i;
        for(let r=base-i;r<ROWS;r++) set(c,r,'=');
      }
    },
    blob(c,r){ meta.spawns.push({type:'blob',c,r}); },
    fly(c,r){ meta.spawns.push({type:'fly',c,r}); },
    mover(c,r,len,axis,dist,speed){
      movers.push({ x0:c*TILE, y0:r*TILE, x:c*TILE, y:r*TILE, w:len*TILE, h:18,
                    axis, dist:dist*TILE, speed, phase:0, dx:0, dy:0 });
    },
    start(c,r){ meta.start={c,r}; },
    cp(c,r){ meta.checkpoints.push({c,r}); },
    flag(c,r){ meta.flag={c,r}; }
  };

  fn(api);
  return { name, theme, width, grid, movers, meta };
}

buildLevel('Volcano Rumble', 'volcano', 140, g => {

  g.lava(99,101,12);

];

/* ============================================================
   AUDIO — tiny synth, no files
   ============================================================ */
let actx = null, muted = false, musicTimer = null, musicStep = 0;

function audio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type='square', vol=0.13, slideTo=0){
  if(muted) return;
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function seq(notes, gap=0.09){
  notes.forEach((n,i) => setTimeout(() => tone(n[0], n[1] || 0.12, 'square', 0.14), i*gap*1000));
}
const SFX = {
  jump:  () => tone(420, 0.14, 'square', 0.12, 760),
  star:  () => { tone(1050, 0.07, 'square', 0.11); setTimeout(()=>tone(1570,0.11,'square',0.11),60); },
  stomp: () => tone(300, 0.1, 'sawtooth', 0.12, 90),
  bonk:  () => tone(160, 0.08, 'square', 0.1, 100),
  brk:   () => tone(240, 0.14, 'sawtooth', 0.11, 70),
  grow:  () => seq([[523],[659],[784],[1046]], 0.06),
  hurt:  () => seq([[440],[330],[220]], 0.08),
  cp:    () => seq([[784],[1046]], 0.09),
  win:   () => seq([[523],[659],[784],[1046],[784],[1046],[1318,0.4]], 0.12),
  over:  () => seq([[392],[330],[262],[196,0.4]], 0.16)
};

const MEL = [523,0,659,0,784,0,659,0, 587,0,698,0,880,0,698,0,
             523,0,659,0,784,0,1046,0, 880,0,784,0,659,0,587,0];
const BASS = [131,0,0,0,131,0,0,0, 147,0,0,0,147,0,0,0,
              131,0,0,0,131,0,0,0, 165,0,0,0,196,0,0,0];
function musicOn(){
  if(musicTimer) return;
  musicTimer = setInterval(() => {
    if(muted || state !== 'play' || document.hidden){ musicStep = (musicStep+1) % 32; return; }
    const m = MEL[musicStep], b = BASS[musicStep];
    if(m) tone(m, 0.1, 'square', 0.045);
    if(b) tone(b, 0.16, 'triangle', 0.07);
    musicStep = (musicStep+1) % 32;
  }, 132);
}

/* ============================================================
   GAME STATE
   ============================================================ */
let state = 'title';   // title | play | cleared | dead | gameover | victory
let li = 0, level = LEVELS[0], theme = THEMES.grass;
let cam = 0, tick = 0, screenT = 0, shake = 0;
let hearts = 3, stars = 0, totalStars = 0;
let enemies = [], items = [], parts = [], pops = [], bumps = [], movers = [];
let respawn = {x:0, y:0};

const player = {
  x:0, y:0, w:26, h:34, vx:0, vy:0,
  onGround:false, big:false, face:1, run:0,
  coyote:0, buffer:0, invuln:0, anim:'idle', standing:null, dead:false, deadT:0, danceT:0
};

const keys = {};
const localInput = { left:false, right:false, jump:false };
const remoteInput = { left:false, right:false, jump:false };
const input = { left:false, right:false, jump:false, jumpPrev:false };

/* ============================================================
   LEVEL LOADING
   ============================================================ */
function loadLevel(i, keepStars){
  li = i;
  level = LEVELS[i];
  theme = THEMES[level.theme];
  // deep-copy the grid so bricks/blocks reset each attempt
  level.live = level.grid.map(row => row.slice());
  movers = level.movers.map(m => ({...m}));
  enemies = level.meta.spawns.map(s => makeEnemy(s));
  items = []; parts = []; pops = []; bumps = [];
  if(!keepStars) stars = 0;
  respawn = { x: level.meta.start.c*TILE, y: level.meta.start.r*TILE };
  level.meta.checkpoints.forEach(c => c.hit = false);
  level.flagDown = 0;
  resetPlayer(true);
  cam = clampCam(player.x - VW/2);
}

function resetPlayer(full){
  player.x = respawn.x; player.y = respawn.y;
  player.vx = 0; player.vy = 0;
  player.face = 1; player.dead = false; player.deadT = 0; player.danceT = 0;
  player.invuln = full ? 0 : 90;
  player.standing = null;
  if(full){ player.big = false; sizePlayer(); }
}
function sizePlayer(){
  const bottom = player.y + player.h;
  player.w = player.big ? 30 : 26;
  player.h = player.big ? 52 : 34;
  player.y = bottom - player.h;
}

function makeEnemy(s){
  if(s.type === 'fly'){
    return { type:'fly', x:s.c*TILE+6, y:s.r*TILE+6, w:28, h:24,
             baseY:s.r*TILE+6, vx:-1.05, t:Math.random()*6, dead:0, face:-1 };
  }
  return { type:'blob', x:s.c*TILE+5, y:s.r*TILE+6, w:30, h:28,
           vx:-1.0, vy:0, onGround:false, dead:0, face:-1, wob:Math.random()*6 };
}

/* ============================================================
   TILE HELPERS
   ============================================================ */
function tile(c,r){
  if(r < 0 || r >= ROWS || c < 0 || c >= level.width) return ' ';
  return level.live[r][c];
}
function setTile(c,r,ch){
  if(r >= 0 && r < ROWS && c >= 0 && c < level.width) level.live[r][c] = ch;
}
function clampCam(x){ return Math.max(0, Math.min(level.width*TILE - VW, x)); }

/* Generic AABB vs tilemap movement. */
function moveBody(b, semiOk){
  // --- horizontal ---
  b.x += b.vx;
  b.hitWall = false;
  let c0 = Math.floor(b.x/TILE), c1 = Math.floor((b.x+b.w-1)/TILE);
  let r0 = Math.floor(b.y/TILE), r1 = Math.floor((b.y+b.h-1)/TILE);
  for(let r=r0;r<=r1;r++){
    for(let c=c0;c<=c1;c++){
      if(isSolid(tile(c,r))){
        if(b.vx > 0) b.x = c*TILE - b.w;
        else if(b.vx < 0) b.x = (c+1)*TILE;
        b.vx = 0; b.hitWall = true;
        c0 = Math.floor(b.x/TILE); c1 = Math.floor((b.x+b.w-1)/TILE);
      }
    }
  }
  if(b.x < 0){ b.x = 0; b.vx = 0; b.hitWall = true; }
  const maxX = level.width*TILE - b.w;
  if(b.x > maxX){ b.x = maxX; b.vx = 0; b.hitWall = true; }

  // --- vertical ---
  const prevBottom = b.y + b.h;
  b.onGround = false; b.bonk = null;
  b.y += b.vy;
  r0 = Math.floor(b.y/TILE); r1 = Math.floor((b.y+b.h-1)/TILE);
  c0 = Math.floor(b.x/TILE); c1 = Math.floor((b.x+b.w-1)/TILE);
  for(let c=c0;c<=c1;c++){
    for(let r=r0;r<=r1;r++){
      const ch = tile(c,r);
      let hit = false;
      if(isSolid(ch)) hit = true;
      else if(semiOk && isSemi(ch) && b.vy > 0 && prevBottom <= r*TILE + 3) hit = true;
      if(hit){
        if(b.vy > 0){ b.y = r*TILE - b.h; b.vy = 0; b.onGround = true; }
        else if(b.vy < 0){ b.y = (r+1)*TILE; b.vy = 0; b.bonk = {c,r}; }
        r0 = Math.floor(b.y/TILE); r1 = Math.floor((b.y+b.h-1)/TILE);
      }
    }
  }
}
function touchesHazard(b){
  const c0 = Math.floor((b.x+4)/TILE), c1 = Math.floor((b.x+b.w-5)/TILE);
  const r0 = Math.floor((b.y+4)/TILE), r1 = Math.floor((b.y+b.h-3)/TILE);
  for(let c=c0;c<=c1;c++) for(let r=r0;r<=r1;r++) if(isHazard(tile(c,r))) return true;
  return false;
}
const overlap = (a,b) =>
  a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ============================================================
   EFFECTS
   ============================================================ */
function puff(x,y,color,n,spread){
  for(let i=0;i<n;i++){
    parts.push({ x, y, vx:(Math.random()-.5)*(spread||4), vy:-Math.random()*4-1,
                 life:26+Math.random()*16, r:2+Math.random()*4, color });
  }
}
function pop(x,y,text){ pops.push({x, y, text, life:50}); }

/* ============================================================
   UPDATE
   ============================================================ */
function update(){
  input.left = localInput.left || remoteInput.left;
  input.right = localInput.right || remoteInput.right;
  input.jump = localInput.jump || remoteInput.jump;
  tick++;
  if(shake > 0) shake--;

  if(state === 'title' || state === 'gameover' || state === 'victory'){
    screenT++;
    if(input.jump && !input.jumpPrev && screenT > 20){
      audio();
      if(state === 'title'){ totalStars = 0; hearts = 3; loadLevel(0); state = 'play'; musicOn(); }
      else if(state === 'gameover'){ hearts = 3; loadLevel(li); state = 'play'; }
      else { totalStars = 0; hearts = 3; loadLevel(0); state = 'play'; }
      screenT = 0;
    }
    input.jumpPrev = input.jump;
    return;
  }

  if(state === 'cleared'){
    screenT++;
    level.flagDown = Math.min(1, level.flagDown + 0.03);
    player.danceT++;
    updateParticles();
    if(screenT > 150){
      totalStars += stars;
      if(li + 1 < LEVELS.length){ loadLevel(li+1); state = 'play'; screenT = 0; }
      else { state = 'victory'; screenT = 0; }
    }
    input.jumpPrev = input.jump;
    return;
  }

  if(state === 'dead'){
    player.deadT++;
    player.vy = Math.min(MAXFALL, player.vy + GRAV);
    player.y += player.vy;
    updateParticles();
    if(player.deadT > 70){
      if(hearts <= 0){ state = 'gameover'; screenT = 0; SFX.over(); }
      else { resetPlayer(false); state = 'play'; cam = clampCam(player.x - VW/2); }
    }
    input.jumpPrev = input.jump;
    return;
  }

  updatePlayer();
  updateMovers();
  updateEnemies();
  updateItems();
  updateParticles();

  // camera: lead slightly in the direction of travel
  const want = player.x + player.w/2 - VW/2 + player.face*60;
  cam += (clampCam(want) - cam) * 0.11;
  cam = clampCam(cam);

  input.jumpPrev = input.jump;
}

function updatePlayer(){
  const p = player;
  if(p.invuln > 0) p.invuln--;

  // carry along a moving platform
  if(p.standing){ p.x += p.standing.dx; p.y += p.standing.dy; }
  p.standing = null;

  const maxRun = p.big ? RUN_B : RUN_S;
  if(input.left && !input.right){ p.vx -= ACC; p.face = -1; }
  else if(input.right && !input.left){ p.vx += ACC; p.face = 1; }
  else {
    if(p.vx > FRIC) p.vx -= FRIC;
    else if(p.vx < -FRIC) p.vx += FRIC;
    else p.vx = 0;
  }
  p.vx = Math.max(-maxRun, Math.min(maxRun, p.vx));

  // jump: coyote time + input buffering makes it forgiving for small hands
  if(input.jump && !input.jumpPrev) p.buffer = BUFFER;
  if(p.buffer > 0) p.buffer--;
  if(p.coyote > 0) p.coyote--;
  if(p.buffer > 0 && p.coyote > 0){
    p.vy = JUMP_V; p.buffer = 0; p.coyote = 0; p.onGround = false;
    SFX.jump();
  }
  if(!input.jump && p.vy < -4) p.vy *= JUMP_CUT;

  p.vy = Math.min(MAXFALL, p.vy + GRAV);
  moveBody(p, true);

  if(p.onGround){
    p.coyote = COYOTE;
  }

  // head bonk on blocks
  if(p.bonk) hitBlock(p.bonk.c, p.bonk.r);

  // ride movers
  for(const m of movers){
    const box = {x:m.x, y:m.y, w:m.w, h:m.h};
    if(overlap(p, box)){
      const fromTop = (p.y + p.h) - m.y;
      if(p.vy >= 0 && fromTop < 22){
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.coyote = COYOTE;
        p.standing = m;
      }
    }
  }

  // collectibles
  const c0 = Math.floor(p.x/TILE), c1 = Math.floor((p.x+p.w-1)/TILE);
  const r0 = Math.floor(p.y/TILE), r1 = Math.floor((p.y+p.h-1)/TILE);
  for(let c=c0;c<=c1;c++) for(let r=r0;r<=r1;r++){
    if(tile(c,r) === 'o'){
      setTile(c,r,' '); stars++; SFX.star();
      puff(c*TILE+20, r*TILE+20, '#ffd23f', 7, 4);
    }
  }

  // checkpoints
  for(const cp of level.meta.checkpoints){
    if(!cp.hit && Math.abs(p.x - cp.c*TILE) < 40 && Math.abs(p.y - cp.r*TILE) < 90){
      cp.hit = true; respawn = {x:cp.c*TILE, y:(cp.r-1)*TILE};
      SFX.cp(); pop(cp.c*TILE, cp.r*TILE-10, 'CHECKPOINT!');
      puff(cp.c*TILE+20, cp.r*TILE+10, '#4be3a0', 14, 5);
    }
  }

  // flag
  const fl = level.meta.flag;
  if(state === 'play' && p.x + p.w > fl.c*TILE + 6 && p.y < (fl.r+1)*TILE){
    state = 'cleared'; screenT = 0; SFX.win();
    p.vx = 0; p.vy = 0;
    puff(fl.c*TILE+20, fl.r*TILE, '#ffd23f', 26, 7);
  }

  // hazards / falling off the world
  if(touchesHazard(p) || p.y > VH + 200) die();
}

function hitBlock(c,r){
  const ch = tile(c,r);
  if(ch === '?' || ch === '!'){
    setTile(c,r,'u');
    bumps.push({c, r, t:14});
    if(ch === '?'){
      stars++; SFX.star(); pop(c*TILE, r*TILE-6, '+1');
      puff(c*TILE+20, r*TILE-4, '#ffd23f', 9, 4);
    } else {
      items.push({ type:'snack', x:c*TILE+6, y:r*TILE-28, w:28, h:28,
                   vx:1.3, vy:-3, born:0 });
      SFX.grow();
    }
  } else if(ch === 'b'){
    if(player.big){
      setTile(c,r,' '); SFX.brk(); shake = 8;
      puff(c*TILE+20, r*TILE+20, theme.brick, 14, 6);
    } else { SFX.bonk(); bumps.push({c, r, t:12}); }
  } else if(isSolid(ch)){
    SFX.bonk();
  }
}

function updateMovers(){
  for(const m of movers){
    const px = m.x, py = m.y;
    m.phase += 0.018 * m.speed;
    const off = Math.sin(m.phase) * m.dist;
    m.x = m.axis === 'h' ? m.x0 + off : m.x0;
    m.y = m.axis === 'v' ? m.y0 + off : m.y0;
    m.dx = m.x - px;
    m.dy = m.y - py;
  }
}

function updateEnemies(){
  const p = player;
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.dead){ e.dead++; if(e.dead > 26) enemies.splice(i,1); continue; }

    // only wake up enemies near the view
    if(e.x < cam - 200 || e.x > cam + VW + 300) continue;

    if(e.type === 'blob'){
      e.wob += 0.15;
      e.vy = Math.min(MAXFALL, e.vy + GRAV);
      moveBody(e, false);
      if(e.hitWall) e.vx = -e.vx;
      // turn around at ledges so they never walk into pits
      if(e.onGround){
        const ahead = Math.floor((e.x + (e.vx>0 ? e.w+4 : -4)) / TILE);
        const below = Math.floor((e.y + e.h + 6) / TILE);
        if(!isSolid(tile(ahead,below)) && !isSemi(tile(ahead,below))) e.vx = -e.vx;
      }
      e.face = e.vx > 0 ? 1 : -1;
      if(touchesHazard(e) || e.y > VH + 200){ enemies.splice(i,1); continue; }
    } else {
      e.t += 0.06;
      e.x += e.vx;
      e.y = e.baseY + Math.sin(e.t) * 46;
      e.face = e.vx > 0 ? 1 : -1;
      const c = Math.floor((e.x + (e.vx>0 ? e.w : 0)) / TILE);
      const r = Math.floor((e.y + e.h/2) / TILE);
      if(isSolid(tile(c,r)) || e.x < 0 || e.x > level.width*TILE - e.w) e.vx = -e.vx;
    }

    // player collision
    if(!p.dead && state === 'play' && overlap(p, e)){
      const stomping = p.vy > 1 && (p.y + p.h) - e.y < 24;
      if(stomping){
        e.dead = 1; p.vy = STOMP_V; p.coyote = 0;
        SFX.stomp(); shake = 5; stars += 1;
        pop(e.x, e.y - 8, '+1');
        puff(e.x + e.w/2, e.y + e.h/2, e.type === 'fly' ? '#ff9d4d' : '#a06bff', 12, 5);
      } else if(p.invuln <= 0){
        hurt();
      }
    }
  }
}

function updateItems(){
  const p = player;
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.born++;
    if(it.born < 22){ it.y -= 1.3; }      // pop out of the block
    else {
      it.vy = Math.min(MAXFALL, it.vy + GRAV);
      moveBody(it, false);
      if(it.hitWall) it.vx = -it.vx;
    }
    if(it.y > VH + 200){ items.splice(i,1); continue; }
    if(state === 'play' && overlap(p, it)){
      items.splice(i,1);
      if(!p.big){ p.big = true; sizePlayer(); }
      stars += 3;
      SFX.grow(); pop(p.x, p.y - 10, 'POWER UP!');
      puff(p.x + p.w/2, p.y + p.h/2, '#ff5fa2', 18, 6);
    }
  }
}

function updateParticles(){
  for(let i=parts.length-1;i>=0;i--){
    const q = parts[i];
    q.x += q.vx; q.y += q.vy; q.vy += 0.22; q.life--;
    if(q.life <= 0) parts.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){
    pops[i].y -= 0.7; pops[i].life--;
    if(pops[i].life <= 0) pops.splice(i,1);
  }
  for(let i=bumps.length-1;i>=0;i--){
    bumps[i].t--; if(bumps[i].t <= 0) bumps.splice(i,1);
  }
}

function hurt(){
  const p = player;
  if(p.big){
    p.big = false; sizePlayer(); p.invuln = 100;
    SFX.hurt(); shake = 8;
    puff(p.x + p.w/2, p.y + p.h/2, '#ffffff', 14, 6);
  } else {
    die();
  }
}
function die(){
  if(state !== 'play') return;
  hearts--;
  state = 'dead';
  player.dead = true; player.deadT = 0;
  player.vy = -9; player.vx = 0;
  SFX.hurt(); shake = 10;
  puff(player.x + player.w/2, player.y + player.h/2, '#ffffff', 16, 6);
}

/* ============================================================
   DRAWING HELPERS
   ============================================================ */
function rr(x,y,w,h,r){
  ctx.beginPath();
  const rad = Math.min(r, w/2, h/2);
  ctx.moveTo(x+rad, y);
  ctx.arcTo(x+w, y, x+w, y+h, rad);
  ctx.arcTo(x+w, y+h, x, y+h, rad);
  ctx.arcTo(x, y+h, x, y, rad);
  ctx.arcTo(x, y, x+w, y, rad);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,color,outline){
  rr(x,y,w,h,r); ctx.fillStyle = color; ctx.fill();
  if(outline){ ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.stroke(); }
}
function starPath(cx,cy,R,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a = rot + i*Math.PI/5;
    const rad = i%2 ? r : R;
    const x = cx + Math.cos(a-Math.PI/2)*rad, y = cy + Math.sin(a-Math.PI/2)*rad;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function text(str, x, y, size, color, align, outline){
  ctx.font = `700 ${size}px Fredoka, 'Baloo 2', 'Trebuchet MS', sans-serif`;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if(outline){ ctx.lineWidth = size/5; ctx.strokeStyle = outline; ctx.lineJoin='round'; ctx.strokeText(str,x,y); }
  ctx.fillStyle = color; ctx.fillText(str,x,y);
}

/* ============================================================
   DANNY — drawn from shapes, animated
   ============================================================ */
function drawDanny(x, y, w, h, face, anim, t){
  const s = h / 34;                       // scale relative to small size
  const cx = x + w/2, bottom = y + h;
  const bob = anim === 'idle' ? Math.sin(t*0.09)*1.2 : 0;
  const swing = anim === 'run' ? Math.sin(t*0.42) : 0;
  const ink = '#2b1a45';

  ctx.save();
  ctx.translate(cx, bottom + bob);
  ctx.scale(face, 1);

  // shadow
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, w*0.44, 4.5, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;

  const legY = -10*s, legH = 11*s, legW = 6.5*s;
  const shoeC = '#ff4d6d';
  if(anim === 'jump'){
    fillRR(-8*s, legY, legW, legH*0.8, 3, '#f2a35c', ink);
    fillRR(1.5*s, legY-2*s, legW, legH*0.8, 3, '#f2a35c', ink);
    fillRR(-9.5*s, legY+legH*0.7, legW+3*s, 5*s, 2.5, shoeC, ink);
    fillRR(0, legY+legH*0.6, legW+3*s, 5*s, 2.5, shoeC, ink);
  } else if(anim === 'dance'){
    const d = Math.sin(t*0.3)*4*s;
    fillRR(-8*s+d, legY, legW, legH, 3, '#f2a35c', ink);
    fillRR(1.5*s-d, legY, legW, legH, 3, '#f2a35c', ink);
    fillRR(-9.5*s+d, legY+legH-1, legW+3*s, 5*s, 2.5, shoeC, ink);
    fillRR(0-d, legY+legH-1, legW+3*s, 5*s, 2.5, shoeC, ink);
  } else {
    const a = swing*5*s;
    fillRR(-8*s+a, legY, legW, legH, 3, '#f2a35c', ink);
    fillRR(1.5*s-a, legY, legW, legH, 3, '#f2a35c', ink);
    fillRR(-9.5*s+a, legY+legH-1, legW+3*s, 5*s, 2.5, shoeC, ink);
    fillRR(0-a, legY+legH-1, legW+3*s, 5*s, 2.5, shoeC, ink);
  }

  // shorts
  fillRR(-9*s, -14*s, 18*s, 6*s, 2.5, '#2f7de0', ink);

  // arms behind body
  const armSw = anim === 'jump' ? -1 : swing;
  ctx.save();
  ctx.translate(7.5*s, -22*s); ctx.rotate(-armSw*0.9 - (anim==='jump'?1.5:0));
  fillRR(-2.5*s, 0, 5*s, 11*s, 2.5, '#41a3ff', ink);
  ctx.fillStyle = '#f6b877'; ctx.beginPath(); ctx.arc(0, 12*s, 3.2*s, 0, 7); ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = ink; ctx.stroke();
  ctx.restore();

  // shirt
  fillRR(-9.5*s, -25*s, 19*s, 12*s, 4, '#41a3ff', ink);
  ctx.save();
  starPath(0, -19.5*s, 4.4*s, 2*s, Math.sin(t*0.05)*0.15);
  ctx.fillStyle = '#ffd23f'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = ink; ctx.stroke();
  ctx.restore();

  // front arm
  ctx.save();
  ctx.translate(-7.5*s, -22*s); ctx.rotate(armSw*0.9 + (anim==='jump'?1.4:0));
  fillRR(-2.5*s, 0, 5*s, 11*s, 2.5, '#41a3ff', ink);
  ctx.fillStyle = '#f6b877'; ctx.beginPath(); ctx.arc(0, 12*s, 3.2*s, 0, 7); ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = ink; ctx.stroke();
  ctx.restore();

  // head
  const hy = -33*s;
  ctx.fillStyle = '#f6b877';
  ctx.beginPath(); ctx.arc(0, hy, 8.6*s, 0, 7); ctx.fill();
  ctx.lineWidth = 2.8; ctx.strokeStyle = ink; ctx.stroke();

  // hair
  ctx.beginPath();
  ctx.arc(0, hy - 1.5*s, 8.6*s, Math.PI*1.03, Math.PI*2.02);
  ctx.lineTo(7*s, hy - 4*s);
  ctx.closePath();
  ctx.fillStyle = '#4a2c18'; ctx.fill();
  ctx.lineWidth = 2.2; ctx.strokeStyle = ink; ctx.stroke();

  // eyes + smile
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(-3*s, hy+0.5*s, 1.5*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4*s, hy+0.5*s, 1.5*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0.4*s, hy+3.6*s, 3.4*s, 0.15, Math.PI-0.15); 
  ctx.lineWidth = 2.2; ctx.strokeStyle = ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,.45)';
  ctx.beginPath(); ctx.arc(-6*s, hy+2.6*s, 2*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(6.4*s, hy+2.6*s, 2*s, 0, 7); ctx.fill();

  ctx.restore();
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  drawSky();
  if(state === 'title'){ drawTitle(); ctx.restore(); return; }

  drawParallax();
  drawTiles();
  drawFlag();
  drawCheckpoints();
  drawMovers();
  drawItems();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawHUD();

  if(state === 'cleared') drawBanner('LEVEL CLEAR!', `${level.name} — ${stars} stars`, '#4be3a0');
  if(state === 'gameover') drawGameOver();
  if(state === 'victory') drawVictory();

  ctx.restore();
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,VH);
  const t = state === 'title' ? THEMES.grass : theme;
  g.addColorStop(0, t.sky1); g.addColorStop(1, t.sky2);
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
}

function drawParallax(){
  // sun / volcano glow
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = theme.haze;
  ctx.beginPath(); ctx.arc(660, 90, 46, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.22;
  ctx.beginPath(); ctx.arc(660, 90, 78, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;

  // far hills
  const off1 = -(cam*0.22) % 420;
  ctx.fillStyle = theme.hillB;
  for(let i=-1;i<4;i++){
    const bx = off1 + i*420;
    ctx.beginPath();
    ctx.moveTo(bx, VH);
    ctx.quadraticCurveTo(bx+110, VH-215, bx+220, VH);
    ctx.quadraticCurveTo(bx+320, VH-160, bx+420, VH);
    ctx.closePath(); ctx.fill();
  }
  // near hills
  const off2 = -(cam*0.42) % 380;
  ctx.fillStyle = theme.hillA;
  for(let i=-1;i<4;i++){
    const bx = off2 + i*380;
    ctx.beginPath();
    ctx.moveTo(bx, VH);
    ctx.quadraticCurveTo(bx+95, VH-150, bx+190, VH);
    ctx.quadraticCurveTo(bx+285, VH-110, bx+380, VH);
    ctx.closePath(); ctx.fill();
  }
  // clouds
  const off3 = -(cam*0.55) % 340;
  ctx.fillStyle = theme.cloud; ctx.globalAlpha = 0.9;
  for(let i=-1;i<4;i++){
    const bx = off3 + i*340, by = 70 + (i%2)*55;
    ctx.beginPath();
    ctx.arc(bx, by, 26, 0, 7); ctx.arc(bx+28, by-12, 32, 0, 7);
    ctx.arc(bx+62, by, 24, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTiles(){
  const cStart = Math.max(0, Math.floor(cam/TILE) - 1);
  const cEnd = Math.min(level.width-1, Math.ceil((cam+VW)/TILE) + 1);
  for(let c=cStart;c<=cEnd;c++){
    for(let r=0;r<ROWS;r++){
      const ch = tile(c,r);
      if(ch === ' ') continue;
      const bump = bumps.find(b => b.c === c && b.r === r);
      const x = c*TILE - cam, y = r*TILE - (bump ? Math.sin((14-bump.t)/14*Math.PI)*10 : 0);
      drawTile(ch, x, y, c, r);
    }
  }
}

function drawTile(ch, x, y, c, r){
  const T = theme;
  switch(ch){
    case '=': {
      const grassTop = !isSolid(tile(c,r-1));
      ctx.fillStyle = T.dirt; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = T.dirtDk;
      ctx.fillRect(x, y+TILE-6, TILE, 6);
      ctx.fillRect(x+TILE-5, y, 5, TILE);
      // pebbles
      ctx.fillStyle = 'rgba(0,0,0,.10)';
      ctx.fillRect(x+8+((c*7)%14), y+16+((r*5)%12), 6, 5);
      if(grassTop){
        ctx.fillStyle = T.top; ctx.fillRect(x, y, TILE, 13);
        ctx.fillStyle = T.topDk; ctx.fillRect(x, y+11, TILE, 4);
        ctx.fillStyle = T.top;
        ctx.beginPath(); ctx.arc(x+10, y+4, 7, 0, 7); ctx.arc(x+28, y+4, 8, 0, 7); ctx.fill();
      }
      break;
    }
    case 'n': {
      ctx.fillStyle = '#a2683c'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#7f4f2c';
      for(let i=0;i<3;i++) ctx.fillRect(x+4, y+6+i*12, TILE-8, 4);
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, TILE-2, TILE-2);
      break;
    }
    case 'b': {
      ctx.fillStyle = T.brick; ctx.fillRect(x, y, TILE, TILE);
      ctx.strokeStyle = T.brickDk; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y+13); ctx.lineTo(x+TILE, y+13);
      ctx.moveTo(x, y+27); ctx.lineTo(x+TILE, y+27);
      ctx.moveTo(x+20, y); ctx.lineTo(x+20, y+13);
      ctx.moveTo(x+8, y+13); ctx.lineTo(x+8, y+27);
      ctx.moveTo(x+30, y+13); ctx.lineTo(x+30, y+27);
      ctx.moveTo(x+20, y+27); ctx.lineTo(x+20, y+TILE);
      ctx.stroke();
      break;
    }
    case '?': case '!': {
      const glow = 0.5 + Math.sin(tick*0.11 + c)*0.5;
      fillRR(x+2, y+2, TILE-4, TILE-4, 7, ch === '?' ? '#ffc21c' : '#ff5fa2', '#7a4a00');
      ctx.globalAlpha = 0.25 + glow*0.35;
      fillRR(x+6, y+6, TILE-12, TILE-12, 5, '#ffffff');
      ctx.globalAlpha = 1;
      text(ch === '?' ? '?' : '★', x+TILE/2, y+TILE/2+1, 22, '#ffffff', 'center', '#7a4a00');
      break;
    }
    case 'u': {
      fillRR(x+2, y+2, TILE-4, TILE-4, 7, '#9c7c52', '#6b5233');
      break;
    }
    case 'c': {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x+10, y+22, 14, 0, 7); ctx.arc(x+22, y+16, 16, 0, 7);
      ctx.arc(x+34, y+22, 13, 0, 7);
      ctx.rect(x, y+18, TILE, 16);
      ctx.fill();
      ctx.fillStyle = 'rgba(140,180,230,.35)';
      ctx.fillRect(x, y+30, TILE, 5);
      break;
    }
    case '-': {
      fillRR(x, y+4, TILE, 14, 5, '#c98f4e', '#8a5c2c');
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x+3, y+7, TILE-6, 3);
      break;
    }
    case '^': {
      const w1 = Math.sin(tick*0.08 + c*0.7)*3;
      ctx.fillStyle = '#ff5a1f'; ctx.fillRect(x, y+8, TILE, TILE-8);
      ctx.fillStyle = '#ffb02e';
      ctx.beginPath();
      ctx.moveTo(x, y+12+w1);
      ctx.quadraticCurveTo(x+20, y+4+w1, x+TILE, y+12-w1);
      ctx.lineTo(x+TILE, y+TILE); ctx.lineTo(x, y+TILE); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,190,.7)';
      ctx.beginPath(); ctx.arc(x+12+w1*2, y+22, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x+30-w1*2, y+28, 2.4, 0, 7); ctx.fill();
      break;
    }
    case '~': {
      ctx.fillStyle = '#e0431a'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = 'rgba(255,160,40,.35)';
      ctx.beginPath(); ctx.arc(x+14, y+18+Math.sin(tick*0.06+c)*4, 5, 0, 7); ctx.fill();
      break;
    }
    case 'o': {
      const bobY = Math.sin(tick*0.1 + c*0.5)*3;
      ctx.save();
      ctx.translate(x+TILE/2, y+TILE/2 + bobY);
      ctx.scale(Math.cos(tick*0.05 + c*0.4), 1);
      starPath(0, 0, 13, 6, 0);
      ctx.fillStyle = '#ffd23f'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#c98a00'; ctx.stroke();
      ctx.restore();
      break;
    }
  }
}

function drawQRModules(matrix, boxX, boxY, boxSize){
  if(!matrix) return;
  const n = matrix.size, quiet = 4, cell = boxSize / (n + quiet*2);
  ctx.fillStyle = '#ffffff';
  fillRR(boxX, boxY, boxSize, boxSize, 8, '#ffffff');
  ctx.fillStyle = '#2b1a45';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(matrix.get(r,c)){
        const px = boxX + (quiet+c)*cell, py = boxY + (quiet+r)*cell;
        ctx.fillRect(Math.floor(px), Math.floor(py), Math.ceil(cell)+1, Math.ceil(cell)+1);
      }
    }
  }
}

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', AltLeft:'jump', AltRight:'jump'
};
addEventListener('keydown', e => {
  if(e.code === 'KeyM') toggleSound();
  // On the "press to continue" screens, ANY key advances — not just Space/W/Up.
  // A TV remote's OK/select button rarely maps to something in KEYMAP, so
  // requiring an exact match here would leave remote-only users stuck.
  if(!controllerMode && (state === 'title' || state === 'gameover' || state === 'victory')){
    e.preventDefault(); audio();
    localInput.jump = true; setTimeout(() => localInput.jump = false, 80);
    return;
  }
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); localInput[k] = true; keys[e.code] = true; audio(); }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if(k){
    e.preventDefault(); keys[e.code] = false;
    localInput[k] = Object.keys(KEYMAP).some(c => KEYMAP[c] === k && keys[c]);
  }
});

/* Some TV/remote-control browsers inject presses as raw touch or pointer
   events without generating the follow-up synthetic 'click' (the movement
   pad already sidesteps this by binding touchstart/mousedown directly).
   bindTap() gives every other button the same resilience: it listens on
   click, touchend, and pointerup at once, with a de-dupe guard so a normal
   touchscreen — which correctly fires more than one of these per tap —
   doesn't trigger the handler twice. */
function bindTap(el, handler){
  if(!el) return;
  let last = 0;
  function go(e){
    const t = Date.now();
    if(t - last < 350) return;
    last = t;
    handler(e);
  }
  el.addEventListener('click', go);
  el.addEventListener('touchend', e => { e.preventDefault(); go(e); }, {passive:false});
  el.addEventListener('pointerup', go);
}

function bindTouch(el, key){
  const on  = e => { e.preventDefault(); localInput[key] = true; audio(); };
  const off = e => { e.preventDefault(); localInput[key] = false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch(document.getElementById('bL'), 'left');
bindTouch(document.getElementById('bR'), 'right');
bindTouch(document.getElementById('bJ'), 'jump');

if('ontouchstart' in window || navigator.maxTouchPoints > 0){
  document.getElementById('pad').classList.add('on');
}

/* ============================================================
   REMOTE CONTROLLER — a second (phone) device as a gamepad,
   paired peer-to-peer over WebRTC via the free PeerJS broker.
   No account, no server of our own. Everything here is additive:
   keyboard, touch, and a linked phone all just feed the same
   localInput/remoteInput objects merged at the top of update().
   ============================================================ */
const PEER_PREFIX = 'dgja-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no 0/O/1/I/L — easy to read aloud
function randomCode(len){
  let s = '';
  for(let i=0;i<len;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
function joinUrl(code){ return location.origin + location.pathname + '#play=' + code; }
function parseHashCode(){
  const m = /#play=([A-Za-z0-9]{1,8})/.exec(location.hash);
  return m ? m[1].toUpperCase() : '';
}
const hasPeer = typeof Peer !== 'undefined';

const linkModal = document.getElementById('linkModal');
const linkClose = document.getElementById('linkClose');
const linkCodeBox = document.getElementById('linkCodeBox');

function showLinkCode(code){
  if(linkCodeBox) linkCodeBox.textContent = code;
  const url = joinUrl(code);
  if(linkUrlText) linkUrlText.textContent = url;
  if(linkQR && typeof QRCode !== 'undefined'){
    QRCode.toDataURL(url, { width:220, margin:1, color:{ dark:'#2b1a45', light:'#ffffff' } })
      .then(durl => { linkQR.src = durl; })
      .catch(() => {});   // QR is a nice-to-have; the code + URL text still work without it
  }
}

const Host = {
  peer:null, conn:null, code:null, connected:false, lastMsgAt:0, watchdog:null, tries:0,

  ensurePeer(){
    if(this.peer && !this.peer.destroyed) return;
    if(!hasPeer){ setLinkStatus("This needs an internet connection to pair a phone."); return; }
    this.tries = 0;
    this.openFreshPeer();
  },
  openFreshPeer(){
    this.code = randomCode(4);
    refreshTitleQR();   // the QR only encodes a URL string, so it's ready instantly —
                         // no need to wait on the signaling round-trip to show it
    setLinkStatus('Getting your code ready…');
    try {
      this.peer = new Peer(PEER_PREFIX + this.code, { debug:0 });
    } catch(e){
      setLinkStatus("Couldn't start pairing on this browser.");
      return;
    }
    this.peer.on('open', () => { showLinkCode(this.code); setLinkStatus('Waiting for a phone to join…'); });
    this.peer.on('connection', c => this.onIncoming(c));
    this.peer.on('error', e => this.onError(e));
    this.peer.on('disconnected', () => { if(this.peer && !this.peer.destroyed && typeof this.peer.reconnect === 'function') this.peer.reconnect(); });
  },
  onError(err){
    const type = err && err.type;
    if(type === 'unavailable-id' && this.tries < 5){
      this.tries++;
      if(this.peer) this.peer.destroy();
      this.openFreshPeer();
      return;
    }
    setLinkStatus("Couldn't connect — check your internet and try again.");
  },
  onIncoming(c){
    if(this.conn && this.conn.open) this.conn.close();     // only one linked pad at a time
    this.conn = c;
    c.on('open', () => {
      this.connected = true;
      remoteInput.left = remoteInput.right = remoteInput.jump = false;
      this.lastMsgAt = performance.now();
      setLinkStatus('📱 Connected! You can close this window and play.');
      this.startWatchdog();
    });
    c.on('data', d => this.onData(d));
    c.on('close', () => this.onLost());
    c.on('error', () => this.onLost());
  },
  onData(d){
    if(!d || typeof d !== 'object') return;
    this.lastMsgAt = performance.now();
    if(d.t === 'in'){ remoteInput.left = !!d.l; remoteInput.right = !!d.r; remoteInput.jump = !!d.j; }
  },
  onLost(){
    if(!this.connected) return;
    this.connected = false;
    remoteInput.left = remoteInput.right = remoteInput.jump = false;
    clearInterval(this.watchdog);
    setLinkStatus('📱 Phone disconnected. Reopen this to reconnect.');
  },
  startWatchdog(){
    clearInterval(this.watchdog);
    this.watchdog = setInterval(() => {
      if(this.connected && performance.now() - this.lastMsgAt > 4000) this.onLost();
    }, 1000);
  }
};

bindTap(linkBtn, () => {
  linkModal.classList.remove('hidden');
  Host.ensurePeer();
  if(Host.code && Host.peer && Host.peer.open) showLinkCode(Host.code);
  if(Host.connected) setLinkStatus('📱 Connected! You can close this window and play.');
});
bindTap(linkClose, () => linkModal.classList.add('hidden'));
bindTap(linkNewCode, () => {
  if(Host.conn && Host.conn.open) Host.conn.close();
  if(Host.peer) Host.peer.destroy();
  Host.peer = null; Host.connected = false;
  remoteInput.left = remoteInput.right = remoteInput.jump = false;
  Host.ensurePeer();
});

/* ---------- CONTROLLER: this device IS the phone gamepad ---------- */
let controllerMode = false;
const ctlOverlay = document.getElementById('ctlOverlay');
const ctlStatusEl = document.getElementById('ctlStatus');
const ctlEntry = document.getElementById('ctlEntry');
const ctlPad = document.getElementById('ctlPad');
const ctlCodeInput = document.getElementById('ctlCodeInput');
const ctlConnectBtn = document.getElementById('ctlConnectBtn');
const ctlBack = document.getElementById('ctlBack');
const ctlModeBtn = document.getElementById('ctlModeBtn');
const wrapEl = document.getElementById('wrap');
const footerLinkEl = document.getElementById('footerLink');

function setCtlStatus(msg){ if(ctlStatusEl) ctlStatusEl.textContent = msg; }

const Controller = {
  peer:null, conn:null, code:'', connected:false, hbTimer:null,

  connect(code){
    code = (code || '').toUpperCase().trim();
    if(!hasPeer){ setCtlStatus("This needs an internet connection to connect."); return; }
    if(code.length < 4){ setCtlStatus('Enter the 4-letter code shown on the game screen.'); return; }
    this.code = code;
    setCtlStatus('Connecting…');
    ctlEntry.classList.add('hidden');
    ctlPad.classList.remove('hidden');
    if(this.peer) this.peer.destroy();
    this.peer = new Peer({ debug:0 });
    this.peer.on('open', () => {
      this.conn = this.peer.connect(PEER_PREFIX + code, { reliable:true });
      this.conn.on('open', () => {
        this.connected = true;
        setCtlStatus('Connected! Use the buttons below.');
        this.startHeartbeat();
      });
      this.conn.on('close', () => this.onLost(false));
      this.conn.on('error', () => this.onLost(false));
    });
    this.peer.on('error', () => {
      setCtlStatus("Couldn't find that game — check the code and try again.");
      this.onLost(true);
    });
  },
  onLost(showEntry){
    this.connected = false;
    clearInterval(this.hbTimer);
    if(showEntry){
      ctlEntry.classList.remove('hidden'); ctlPad.classList.add('hidden');
      if(ctlCodeInput) ctlCodeInput.value = this.code;
    } else {
      setCtlStatus('Disconnected. Check the code and try again.');
    }
  },
  send(s){ if(this.conn && this.conn.open) this.conn.send({ t:'in', l:s.left, r:s.right, j:s.jump }); },
  startHeartbeat(){
    clearInterval(this.hbTimer);
    this.hbTimer = setInterval(() => { if(this.conn && this.conn.open) this.conn.send({ t:'hb' }); }, 1000);
  },
  teardown(){
    clearInterval(this.hbTimer);
    if(this.peer) this.peer.destroy();
    this.peer = null; this.conn = null; this.connected = false;
  }
};

const ctlState = { left:false, right:false, jump:false };
function ctlBind(el, key){
  const on  = e => { e.preventDefault(); ctlState[key] = true; Controller.send(ctlState); if(navigator.vibrate) navigator.vibrate(15); };
  const off = e => { e.preventDefault(); ctlState[key] = false; Controller.send(ctlState); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
ctlBind(document.getElementById('ctlLeft'), 'left');
ctlBind(document.getElementById('ctlRight'), 'right');
ctlBind(document.getElementById('ctlJump'), 'jump');

if(ctlCodeInput) ctlCodeInput.addEventListener('input', () => {
  ctlCodeInput.value = ctlCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
});
if(ctlCodeInput) ctlCodeInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') Controller.connect(ctlCodeInput.value);
});
bindTap(ctlConnectBtn, () => Controller.connect(ctlCodeInput.value));

function enterControllerMode(prefillCode){
  controllerMode = true;
  if(wrapEl) wrapEl.classList.add('hidden');
  if(footerLinkEl) footerLinkEl.classList.add('hidden');
  if(ctlOverlay) ctlOverlay.classList.remove('hidden');
  if(prefillCode){
    Controller.connect(prefillCode);
  } else {
    ctlEntry.classList.remove('hidden'); ctlPad.classList.add('hidden');
    setCtlStatus('Enter the code shown on the game screen');
    if(ctlCodeInput) setTimeout(() => ctlCodeInput.focus(), 50);
  }
}
function exitControllerMode(){
  controllerMode = false;
  Controller.teardown();
  if(ctlOverlay) ctlOverlay.classList.add('hidden');
  if(wrapEl) wrapEl.classList.remove('hidden');
  if(footerLinkEl) footerLinkEl.classList.remove('hidden');
  if(history.replaceState) history.replaceState(null, '', location.pathname);
}
bindTap(ctlBack, exitControllerMode);
bindTap(ctlModeBtn, () => enterControllerMode(''));

/* ============================================================
   MAIN LOOP
   ============================================================ */
const hashCode = parseHashCode();
if(hashCode) enterControllerMode(hashCode);
else { loadLevel(0); state = 'title'; musicOn(); try { Host.ensurePeer(); } catch(e){} }

let last = performance.now(), acc = 0;
function frame(now){
  if(!controllerMode){
    const dt = Math.min(60, now - last); last = now;
    acc += dt;
    let steps = 0;
    while(acc >= 16.6667 && steps < 5){ update(); acc -= 16.6667; steps++; }
    if(steps === 5) acc = 0;
    render();
  } else {
    last = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
</script>
