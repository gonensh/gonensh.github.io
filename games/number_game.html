<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guesser - Lumina Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #main-content {
            margin-right: 120px;
            width: calc(100% - 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #targetNumber {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            font-size: 64px;
            font-weight: 800;
            color: white;
            margin: 0 auto 2rem auto;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #targetNumber.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 45px rgba(16, 185, 129, 0.6);
            transform: scale(1.15) rotate(360deg);
        }

        #message {
            font-size: 22px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        #attempts {
            font-size: 14px;
            font-weight: 700;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.1);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 2rem;
            border: 1px solid rgba(167, 139, 250, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #inputForm {
            margin: 0;
        }

        label[for="userInput"] {
            font-size: 16px;
            font-weight: 500;
            color: #94a3b8;
            display: block;
            margin-bottom: 1rem;
        }

        #userInput {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 28px;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            width: 100%;
            max-width: 220px;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }

        #userInput:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            background: rgba(15, 23, 42, 0.8);
        }

        #userInput::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .btn-container {
            margin-top: 1.5rem;
        }

        #submitBtn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 0.85rem 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            font-family: inherit;
            width: 100%;
            max-width: 220px;
        }

        #submitBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        #submitBtn:active {
            transform: translateY(0);
        }

        /* Sidebar & number line */
        #sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 120px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.3);
            z-index: 100;
            user-select: none;
        }

        #numberLineCanvas {
            width: 100%;
            height: 100%;
        }

        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
        }

        /* Responsive styling */
        @media (max-width: 600px) {
            #sidebar {
                width: 80px;
            }
            #main-content {
                margin-right: 80px;
                width: calc(100% - 80px);
                padding: 1rem;
            }
            .card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>

    <div id="main-content">
        <div class="card">
            <div id="targetNumber">?</div>
            <div id="message">Guess the number!</div>
            <div id="attempts">Attempts: 0</div>
            <div id="inputContainer">
                <form id="inputForm" autocomplete="off">
                    <label for="userInput">Guess a number between -100 and 100:</label>
                    <input type="number" id="userInput" min="-100" max="100" placeholder="e.g. 42" required>
                    <div class="btn-container">
                        <button type="submit" id="submitBtn">Submit Guess</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <canvas id="numberLineCanvas"></canvas>
    </div>

    <script>
        // Game State variables
        let targetNumber = Math.floor(Math.random() * 201) - 100;
        let lowerBound = -100;
        let upperBound = 100;
        let guesses = [];
        let attemptsCount = 0;
        let isWon = false;

        // UI references
        const targetNumberElement = document.getElementById('targetNumber');
        const messageElement = document.getElementById('message');
        const attemptsElement = document.getElementById('attempts');
        const canvas = document.getElementById('numberLineCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas measurements
        let w = 0, h = 0;
        const paddingY = 45;
        let lineH = 0;
        let lineX = 0;
        let isNarrow = false;
        let hoverVal = null;

        // Value conversions
        function valToY(val) {
            const t = (100 - val) / 200;
            return paddingY + t * lineH;
        }

        function yToVal(y) {
            if (lineH === 0) return 0;
            const t = (y - paddingY) / lineH;
            const val = 100 - t * 200;
            return Math.max(-100, Math.min(100, Math.round(val)));
        }

        // Setup resizing and canvas HDPI
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            w = rect.width;
            h = rect.height;
            lineH = h - 2 * paddingY;
            isNarrow = w < 95;
            lineX = isNarrow ? w * 0.45 : w * 0.5;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);

            drawNumberLine();
        }

        window.addEventListener('resize', resizeCanvas);

        // Draw the vertical number line
        function drawNumberLine() {
            if (w === 0 || h === 0) return;

            ctx.clearRect(0, 0, w, h);

            // Responsive sizing variables
            const fontSizeLabel = isNarrow ? '9px Outfit' : '10px Outfit';
            const fontSizeGuess = isNarrow ? 'bold 10px Outfit' : 'bold 11px Outfit';
            const tickSizeMajor = isNarrow ? 8 : 12;
            const tickSizeMinor = isNarrow ? 4 : 6;
            const textOffset = isNarrow ? 3 : 5;
            const guessOffset = isNarrow ? 10 : 14;

            // 1. Draw ruled-out zones (shading)
            // Top ruled-out section
            if (upperBound < 100) {
                ctx.fillStyle = 'rgba(244, 63, 94, 0.08)'; // soft red
                const yTop = valToY(100);
                const yBottom = valToY(upperBound);
                ctx.fillRect(0, yTop, w, yBottom - yTop);
            }

            // Bottom ruled-out section
            if (lowerBound > -100) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.08)'; // soft cyan
                const yTop = valToY(lowerBound);
                const yBottom = valToY(-100);
                ctx.fillRect(0, yTop, w, yBottom - yTop);
            }

            // 2. Draw vertical line track
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.moveTo(lineX, paddingY);
            ctx.lineTo(lineX, paddingY + lineH);
            ctx.stroke();

            // 3. Draw active range highlight
            const yStart = valToY(upperBound);
            const yEnd = valToY(lowerBound);

            const gradient = ctx.createLinearGradient(lineX, yStart, lineX, yEnd);
            gradient.addColorStop(0, '#f43f5e'); // rose-500
            gradient.addColorStop(0.5, '#8b5cf6'); // violet-500
            gradient.addColorStop(1, '#06b6d4'); // cyan-500

            ctx.beginPath();
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.moveTo(lineX, yStart);
            ctx.lineTo(lineX, yEnd);
            ctx.stroke();

            // Active glow overlay
            ctx.save();
            ctx.shadowColor = 'rgba(139, 92, 246, 0.4)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2;
            ctx.moveTo(lineX, yStart);
            ctx.lineTo(lineX, yEnd);
            ctx.stroke();
            ctx.restore();

            // 4. Draw ticks and labels
            for (let val = -100; val <= 100; val += 10) {
                const y = valToY(val);
                const isMajor = (val % 20 === 0);

                ctx.beginPath();
                ctx.strokeStyle = isMajor ? 'rgba(255, 255, 255, 0.35)' : 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = isMajor ? 1.5 : 1;

                const tickSize = isMajor ? tickSizeMajor : tickSizeMinor;
                ctx.moveTo(lineX - tickSize, y);
                ctx.lineTo(lineX, y);
                ctx.stroke();

                if (isMajor) {
                    ctx.fillStyle = val === 0 ? '#a78bfa' : 'rgba(255, 255, 255, 0.5)';
                    ctx.font = val === 0 ? `bold ${fontSizeLabel}` : fontSizeLabel;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(val, lineX - tickSize - textOffset, y);
                }
            }

            // 5. Draw previous guesses markers
            guesses.forEach((g) => {
                const y = valToY(g.value);

                // Dot marker
                ctx.beginPath();
                if (g.isCorrect) {
                    ctx.fillStyle = '#fbbf24'; // amber-400
                    ctx.arc(lineX, y, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.save();
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ffffff';
                    ctx.arc(lineX, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.fillStyle = g.value < targetNumber ? '#38bdf8' : '#f43f5e';
                    ctx.arc(lineX, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Extension pointer line
                ctx.beginPath();
                ctx.strokeStyle = g.isCorrect ? 'rgba(251, 191, 36, 0.4)' : (g.value < targetNumber ? 'rgba(56, 189, 248, 0.4)' : 'rgba(244, 63, 94, 0.4)');
                ctx.lineWidth = 1;
                ctx.moveTo(lineX, y);
                ctx.lineTo(lineX + (guessOffset - 4), y);
                ctx.stroke();

                // Guess text
                ctx.fillStyle = g.isCorrect ? '#fbbf24' : (g.value < targetNumber ? '#38bdf8' : '#f43f5e');
                ctx.font = fontSizeGuess;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(g.value, lineX + guessOffset, y);
            });

            // 6. Draw hover indicators
            if (hoverVal !== null && !isWon) {
                const y = valToY(hoverVal);

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.setLineDash([3, 3]);
                ctx.lineWidth = 1;
                ctx.moveTo(lineX - 15, y);
                ctx.lineTo(lineX + 15, y);
                ctx.stroke();
                ctx.setLineDash([]); // reset

                ctx.beginPath();
                ctx.fillStyle = '#a855f7';
                ctx.arc(lineX, y, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.arc(lineX, y, 5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${fontSizeGuess}`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(hoverVal, lineX + guessOffset, y);
            }
        }

        // Interaction event listeners on sidebar canvas
        canvas.addEventListener('mousemove', (e) => {
            if (isWon) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (mouseY >= paddingY && mouseY <= rect.height - paddingY) {
                hoverVal = yToVal(mouseY);
            } else {
                hoverVal = null;
            }
            drawNumberLine();
        });

        canvas.addEventListener('mouseleave', () => {
            hoverVal = null;
            drawNumberLine();
        });

        canvas.addEventListener('click', (e) => {
            if (isWon) return;
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;

            if (mouseY >= paddingY && mouseY <= rect.height - paddingY) {
                const clickedVal = yToVal(mouseY);
                const userInputEl = document.getElementById('userInput');
                userInputEl.value = clickedVal;
                userInputEl.focus();

                // Playful bounce animation on input focus from click
                userInputEl.style.transform = 'scale(1.08)';
                setTimeout(() => {
                    userInputEl.style.transform = 'none';
                }, 180);
            }
        });

        // Submit form guess handler
        document.getElementById('inputForm').addEventListener('submit', function(event) {
            event.preventDefault();
            if (isWon) return;

            const inputValStr = document.getElementById('userInput').value.trim();
            if (inputValStr === "") return;

            let userInput = parseInt(inputValStr);
            if (isNaN(userInput)) {
                messageElement.innerHTML = "Please enter a valid integer.";
                return;
            }

            if (userInput < -100 || userInput > 100) {
                messageElement.innerHTML = "Please enter a number between -100 and 100.";
                return;
            }

            // Prevent duplicate guesses
            if (guesses.some(g => g.value === userInput)) {
                messageElement.innerHTML = `You already guessed ${userInput}! Try another.`;
                const userInputEl = document.getElementById('userInput');
                userInputEl.style.borderColor = '#f43f5e';
                setTimeout(() => userInputEl.style.borderColor = '', 1000);
                return;
            }

            attemptsCount++;
            attemptsElement.innerHTML = "Attempts: " + attemptsCount;

            if (userInput === targetNumber) {
                isWon = true;
                targetNumberElement.innerHTML = targetNumber;
                targetNumberElement.classList.add('correct');
                messageElement.innerHTML = `🌟 Brilliant! The number is ${targetNumber}! 🌟`;
                guesses.push({ value: targetNumber, isCorrect: true });

                lowerBound = targetNumber;
                upperBound = targetNumber;

                drawNumberLine();
                startConfetti();

                setTimeout(resetGame, 5000);
            } else {
                let isTooLow = userInput < targetNumber;
                guesses.push({ value: userInput, isCorrect: false });

                if (isTooLow) {
                    messageElement.innerHTML = `Your guess <strong>${userInput}</strong> is too low.`;
                    lowerBound = Math.max(lowerBound, userInput + 1);
                } else {
                    messageElement.innerHTML = `Your guess <strong>${userInput}</strong> is too high.`;
                    upperBound = Math.min(upperBound, userInput - 1);
                }

                drawNumberLine();
                document.getElementById('userInput').value = '';
                document.getElementById('userInput').focus();
            }
        });

        // Reset game state
        function resetGame() {
            targetNumberElement.innerHTML = "?";
            targetNumberElement.classList.remove('correct');
            messageElement.innerHTML = "Guess the number!";
            attemptsElement.innerHTML = "Attempts: 0";
            attemptsCount = 0;
            isWon = false;
            targetNumber = Math.floor(Math.random() * 201) - 100;
            lowerBound = -100;
            upperBound = 100;
            guesses = [];
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').focus();
            stopConfetti();
            drawNumberLine();
        }

        // Confetti Particle System
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        class ConfettiParticle {
            constructor() {
                this.x = Math.random() * confettiCanvas.width;
                this.y = Math.random() * -confettiCanvas.height - 20;
                this.size = Math.random() * 8 + 6;
                this.color = `hsl(${Math.random() * 360}, 90%, 60%)`;
                this.speedX = Math.random() * 4 - 2;
                this.speedY = Math.random() * 5 + 5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 4 - 2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                if (this.y > confettiCanvas.height) {
                    this.y = Math.random() * -50 - 20;
                    this.x = Math.random() * confettiCanvas.width;
                    this.speedY = Math.random() * 5 + 5;
                }
            }
            draw() {
                confettiCtx.save();
                confettiCtx.translate(this.x, this.y);
                confettiCtx.rotate(this.rotation * Math.PI / 180);
                confettiCtx.fillStyle = this.color;
                confettiCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                confettiCtx.restore();
            }
        }

        function startConfetti() {
            confettiParticles = [];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push(new ConfettiParticle());
            }

            function animate() {
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confettiParticles.forEach(p => {
                    p.update();
                    p.draw();
                });
                confettiAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

        // Initialize game on load
        document.getElementById('userInput').focus();
        resizeCanvas();
    </script>
</body>
</html>
