        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0f172a;

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {

            }

            50% {
                box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);

        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop-in {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            70% {

            100% {
                opacity: 1;

        .animate-slide-up {

        .animate-pop-in {

        class ConfettiSystem {
            fire() {
                const colors = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#ef4444'];
                for (let i = 0; i < 100; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'confetti';
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.top = '-10px';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const speed = 2 + Math.random() * 3;
                    const angle = Math.random() * Math.PI * 2;
                    const spin = Math.random() * 360;
                    document.body.appendChild(particle);
                    let y = -10, x = parseFloat(particle.style.left), rot = 0;
                    const animate = () => {
                        y += speed; x += Math.sin(angle) * 2; rot += spin * 0.05;
                        particle.style.transform = `translateY(${y}px) translateX(${x - parseFloat(particle.style.left)}px) rotate(${rot}deg)`;
                        if (y < window.innerHeight) requestAnimationFrame(animate); else particle.remove();
                    };
                    requestAnimationFrame(animate);
                }
            }
        }

        class AIService {
            constructor() {
                this.apiKey = "AIzaSyBse3JcPpvqGTwrLSt4HV7h_SgBvlODE5E"; // Let the Canvas automatically provide the key securely
                this.apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${this.apiKey}`;
            }

            // Updated to accept completedConcepts for checkpointing
            async generateTutorResponse(history, node, userLevel, completedConcepts = []) {
                const pendingConcepts = node.guardrails.key_concepts.filter(c => !completedConcepts.includes(c));

                const systemPrompt = `
                You are Lumina, an enthusiastic AI tutor for a gifted 7-year-old child aiming for GED readiness.
                
                HYBRID GUARDRAILS (STRICT ADHERENCE REQUIRED):
                - Topic: ${node.title}
                - GED Standard to cover: ${node.guardrails.ged_standard}
                - Concepts Already Mastered: ${completedConcepts.length > 0 ? completedConcepts.join(', ') : 'None yet.'}
                - Pending Concepts to Teach: ${pendingConcepts.length > 0 ? pendingConcepts.join(', ') : 'All concepts taught! Time for the final mastery check.'}
                - Mastery Condition: ${node.guardrails.mastery_condition}
                
                Your job is to teach the Pending Concepts progressively, tailoring the language to a ${userLevel}.

                INSTRUCTIONS:
                1. Keep your verbal responses EXTREMELY SUCCINCT and punchy (1-2 sentences maximum). Do NOT be wordy. Get straight to the point.
                2. Add an intuitive visualization to EVERY response to explain the concept visually.
                3. Write ALL mathematical expressions using LaTeX notation: $...$ for inline math (e.g. $\frac{1}{2}x = 6$) and $$...$$ for standalone equations.
                
                Output ONLY valid JSON matching this schema:
                {
                    "tutorMessage": "Your VERY SUCCINCT verbal response (1-2 sentences max).",
                    "visualization": "JavaScript code that draws a creative, intuitive visual representation of the current concept on a 400x300 HTML5 Canvas. The code must be plain JavaScript (no HTML/markdown) and use the provided \`ctx\` (CanvasRenderingContext2D) and \`canvas\` variables. Explain the concept using visual metaphors without relying on words. ONLY output raw JavaScript code here. The visualization must be super polished, beautiful, delightful to learners, and clearly explaining the concepts being taught. Keep the colors are warm and joyful and bright, with good contrast considering a dark background.",
                    "isCorrect": boolean (true if the user's last answer was correct, false if wrong. Null if this is the start),
                    "celebrationType": "none" | "confetti",
                    "completedConcept": "If the user's latest response demonstrates solid understanding of one of the Pending Concepts, output the exact string of that concept here. Otherwise null.",
                    "masteryAchieved": boolean (TRUE ONLY if the user has met the exact Mastery Condition. Otherwise false),
                    "nextAction": "lesson" | "question",
                    "questionData": {
                        "text": "The question to test comprehension.",
                        "type": "multiple_choice" | "free_response",
                        "options": ["Option A", "Option B", "Option C"] (Only if multiple_choice)
                    }
                }

                RULES:
                1. If history is empty and Concepts Already Mastered is empty, introduce the first concept in a fun way.
                2. Do not set "masteryAchieved" to true until you are certain the user has met the exact Mastery Condition.
                3. If the user struggles, break the concept down further. Do not just give the answer.
                `;

                const payload = {
                    contents: history,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                try {
                    const response = await fetch(this.apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const rawText = data.candidates[0].content.parts[0].text;

                    // Strip markdown formatting if the model accidentally includes it
                    const cleanJson = rawText.replace(/```json\n?|\n?```/gi, '').trim();
                    return JSON.parse(cleanJson);
                } catch (error) {

                    return {
                        tutorMessage: "Whoops! My connection to the knowledge web just wobbled. Could you try answering that one more time?",
                        isCorrect: null,
                        celebrationType: "none",
                        completedConcept: null,
                        masteryAchieved: false,
                        nextAction: "question",
                        questionData: null
                    };
                }
            }
        }

        const parseMath = (text) => {
            const parts = [];
            const regex = /\$\$([^$]+)\$\$|\$([^$]+)\$/g;
            let lastIndex = 0, match;
            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastIndex) parts.push({ type: 'text', content: text.slice(lastIndex, match.index) });
                parts.push(match[1] !== undefined
                    ? { type: 'block', content: match[1] }
                    : { type: 'inline', content: match[2] });
                lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) parts.push({ type: 'text', content: text.slice(lastIndex) });
            return parts;
        };

        const MathText = ({ text }) => {
            if (!text) return null;
            const parts = parseMath(text);
            return (
                <span>
                    {parts.map((part, i) => {
                        if (part.type === 'text') return <span key={i}>{part.content}</span>;
                        try {
                            const html = window.katex
                                ? window.katex.renderToString(part.content, { displayMode: part.type === 'block', throwOnError: false })
                                : part.content;
                            return <span key={i} className={part.type === 'block' ? 'block my-2 text-center' : ''} dangerouslySetInnerHTML={{ __html: html }} />;
                        } catch {
                            return <span key={i}>{part.content}</span>;
                        }
                    })}
                </span>
            );

                Target: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></svg>,

        const CanvasVisualizer = ({ code }) => {
            const canvasRef = useRef(null);

                const canvas = canvasRef.current;
                if (!canvas || !code) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                try {
                    const drawFn = new Function('ctx', 'canvas', code);
                    drawFn(ctx, canvas);
                } catch (e) {
                    console.error("Canvas drawing error:", e);
                    ctx.fillStyle = '#ef4444';
                    ctx.font = '14px Nunito';
                    ctx.fillText('Visualization Error', 20, 30);

            }, [code]);
            return <canvas ref={canvasRef} width={400} height={300} className="w-full max-w-[400px] bg-slate-800 rounded-2xl shadow-inner mx-auto" />;

                                    {subject.tracks.map((track) => (
                                        <div key={track.track_id} className="space-y-4">
                                            <h3 className="text-xl font-bold text-slate-300 flex items-center gap-2">
                                                <Icon name="Target" size={20} className="text-slate-500" />
                                                {track.title}
                                            </h3>
                                            <div className="space-y-4">
                                                {track.nodes.map((node, idx) => {
                                                    const isUnlocked = isNodeUnlocked(node);
                                                    const isMastered = completedNodes.includes(node.id);

                                                    return (
                                                        <div key={node.id} className="relative group">
                                                            <div
                                                                onClick={() => isUnlocked && !isMastered && onSelectNode(node, subject)}
                                                                onKeyDown={(e) => e.key === 'Enter' && isUnlocked && !isMastered && onSelectNode(node, subject)}
                                                                role="button"
                                                                tabIndex={isUnlocked && !isMastered ? 0 : -1}
                                                                className={`w-full flex flex-col p-5 rounded-2xl transition-all shadow-md text-left ${isMastered ? 'bg-green-900/20 border border-green-700/50 cursor-default opacity-80' :
                                                                    isUnlocked
                                                                        ? 'bg-slate-800/80 hover:bg-slate-700 hover:-translate-y-1 cursor-pointer border border-slate-600 hover:border-purple-500/50'
                                                                        : 'bg-slate-900/40 opacity-70 border border-slate-800 cursor-not-allowed'
                                                                    }`}
                                                            >
                                                                <div className="flex items-center justify-between w-full">
                                                                    <div className="flex items-center gap-4">
                                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${isMastered ? 'bg-green-600 text-white shadow-[0_0_15px_rgba(22,163,74,0.5)]' :
                                                                            isUnlocked ? `bg-gradient-to-br ${subject.color}` : 'bg-slate-800'
                                                                            }`}>
                                                                            {isMastered ? <Icon name="CheckCircle" size={18} /> : isUnlocked ? <Icon name="Unlock" size={18} /> : <Icon name="Lock" size={18} />}
                                                                        </div>
                                                                        <div>
                                                                            <span className="text-xs text-slate-400 font-bold tracking-wider block mb-1">MODULE {idx + 1}</span>
                                                                            <h4 className={`font-bold text-lg ${isMastered ? 'text-green-400' : 'text-slate-200'}`}>{node.title}</h4>
                                                                        </div>
                                                                    </div>
                                                                    {isUnlocked && !isMastered && <Icon name="ChevronRight" size={24} className="text-slate-400" />}
                                                                </div>

                                                                {/* Quest Requirements Panel for Locked Nodes */}
                                                                {!isUnlocked && node.prerequisites.length > 0 && (
                                                                    <div className="mt-4 pt-3 border-t border-slate-800 flex flex-wrap gap-2 items-center">
                                                                        <span className="text-xs text-slate-500 font-bold">QUEST REQUIRES:</span>
                                                                        {node.prerequisites.map(reqId => {
                                                                            const reqInfo = getNodeAndSubjectById(reqId);
                                                                            const isReqMet = completedNodes.includes(reqId);
                                                                            return (
                                                                                <button
                                                                                    key={reqId}
                                                                                    onClick={(e) => {
                                                                                        e.stopPropagation();
                                                                                        if (!isReqMet && reqInfo) onJumpToQuest(reqInfo.node, reqInfo.subject);
                                                                                    }}
                                                                                    className={`text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 border transition-all ${isReqMet
                                                                                        ? 'bg-green-900/20 text-green-400 border-green-800/50'
                                                                                        : 'bg-slate-800 text-slate-300 border-slate-600 hover:border-purple-400 hover:text-purple-300 hover:shadow-[0_0_10px_rgba(168,85,247,0.4)] z-20 relative'
                                                                                        }`}
                                                                                >
                                                                                    {isReqMet ? <Icon name="CheckCircle" size={12} /> : <Icon name="Target" size={12} />}
                                                                                    {reqInfo ? reqInfo.node.title : reqId}
                                                                                </button>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const LearningInterface = ({ node, subject, onBack, onMastery, completedConcepts, onConceptMastery }) => {
            const [history, setHistory] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [currentTurn, setCurrentTurn] = useState(null);
            const [inputValue, setInputValue] = useState('');
            const chatEndRef = useRef(null);

            // Initialize the AI service instance
            const ai = new AIService();

            useEffect(() => { startLesson(); }, []);
            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [history, currentTurn]);

            const startLesson = async () => {
                setIsLoading(true);

                // The Gemini API requires the conversation to have content and start with a user message.
                // We inject a hidden starting prompt to initialize the lesson.
                const initialHistory = [{ role: 'user', parts: [{ text: 'Hello Lumina! I am ready to start this module.' }] }];

                // Pass completedConcepts to ensure continuity on resume
                const response = await ai.generateTutorResponse(initialHistory, node, "Gifted 7-year old", completedConcepts);
                setCurrentTurn(response);
                setHistory([...initialHistory, { role: 'model', parts: [{ text: JSON.stringify(response) }] }]);
                setIsLoading(false);
            };

            const handleSubmit = async (answerText) => {
                if (!answerText.trim() && !currentTurn?.questionData?.options) return;

                const newHistory = [...history, { role: 'user', parts: [{ text: answerText }] }];
                setHistory(newHistory); setInputValue(''); setCurrentTurn(null); setIsLoading(true);

                const response = await ai.generateTutorResponse(newHistory, node, "Gifted 7-year old", completedConcepts);
                if (response.celebrationType === 'confetti') confetti.fire();

                // Save checkpoint if a sub-concept was mastered
                if (response.completedConcept) {
                    onConceptMastery(response.completedConcept);
                }

                setCurrentTurn(response);
                setHistory([...newHistory, { role: 'model', parts: [{ text: JSON.stringify(response) }] }]);
                setIsLoading(false);

                // Report mastery back to the App state
                if (response.masteryAchieved) {
                    onMastery();
                    setTimeout(() => {
                        alert("🎉 Mastery Achieved! The node has been unlocked on your map.");
                    }, 1000);
                }
            };

            return (
                <div className="h-screen flex flex-col bg-[#0f172a]">
                    <header className={`p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex items-center justify-between z-10 shadow-lg`}>
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="p-3 hover:bg-slate-800 rounded-xl transition-colors text-slate-400 hover:text-white">
                                <Icon name="Home" size={24} />
                            </button>
                            <div>
                                <span className={`text-xs font-bold uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r ${subject.color}`}>
                                    {subject.title}
                                </span>
                                <h2 className="font-bold text-xl">{node.title}</h2>
                                {/* Visual Milestone Tracker */}
                                <div className="flex items-center gap-2 mt-1">
                                    {node.guardrails.key_concepts.map((concept, i) => (
                                        <div key={i} title={concept} className={`w-2 h-2 rounded-full ${completedConcepts.includes(concept) ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]' : 'bg-slate-700'}`}></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        {/* Hidden Debug Panel to show Guardrails */}
                        <div className="hidden lg:block text-xs text-slate-500 max-w-sm text-right">
                            <strong>Target Standard:</strong> {node.guardrails.ged_standard}
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 sm:p-8 space-y-6">
                        {history.map((msg, idx) => {
                            // Skip the initial hidden dummy user message
                            if (idx === 0) return null;

                            // Skip the last message if it's the model's active currentTurn (to avoid duplication)
                            if (msg.role === 'model' && idx === history.length - 1 && currentTurn && !isLoading) return null;

                            if (msg.role === 'user') {
                                return (
                                    <div key={idx} className="flex gap-4 max-w-4xl mx-auto justify-end items-start animate-slide-up opacity-60">
                                        <div className="glass-panel p-5 rounded-3xl rounded-tr-sm text-base border-r-2 border-purple-500/50 bg-purple-900/10 text-right max-w-[80%] overflow-hidden">
                                            <div className="text-slate-300 font-medium">{msg.parts[0].text}</div>
                                        </div>
                                        <div className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0">
                                            <Icon name="User" size={18} className="text-purple-400" />
                                        </div>
                                    </div>
                                );
                            }

                            // Model message
                            try {
                                const data = JSON.parse(msg.parts[0].text);
                                return (
                                    <div key={idx} className="flex gap-4 max-w-4xl mx-auto animate-slide-up opacity-60">
                                        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${subject.color} flex items-center justify-center shrink-0`}>
                                            <Icon name="Sparkles" size={18} className="text-white" />
                                        </div>
                                        <div className="glass-panel p-5 rounded-3xl rounded-tl-sm text-base border-l-2 border-slate-600 w-full overflow-hidden">
                                            <div><MathText text={data.tutorMessage} /></div>
                                            {data.visualization && (
                                                <div className="mt-4 flex justify-center items-center w-full">
                                                    <CanvasVisualizer code={data.visualization} />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            } catch (e) {
                                console.error("Error parsing model message in history:", e);
                                return null;
                            }
                        })}

                        {isLoading && (
                            <div className="flex gap-5 max-w-4xl mx-auto animate-slide-up">
                                <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${subject.color} flex items-center justify-center shrink-0 animate-pulse-glow`}>
                                    <Icon name="Sparkles" size={28} className="text-white" />
                                </div>
                                <div className="glass-panel px-6 py-5 rounded-3xl rounded-tl-sm flex items-center gap-1.5">
                                    <span className="text-slate-400 text-sm font-semibold mr-2">Lumina is thinking</span>
                                    <div className="w-2.5 h-2.5 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '0ms'}}></div>
                                    <div className="w-2.5 h-2.5 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '150ms'}}></div>
                                    <div className="w-2.5 h-2.5 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '300ms'}}></div>
                                </div>
                            </div>
                        )}

                        {currentTurn && !isLoading && (
                            <div className="flex gap-5 max-w-4xl mx-auto animate-pop-in relative z-20">
                                <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${subject.color} flex items-center justify-center shrink-0 shadow-[0_0_30px_rgba(168,85,247,0.3)]`}>
                                    <Icon name="Sparkles" size={28} className="text-white" />
                                </div>
                                <div className="flex-1 space-y-6 w-full overflow-hidden">
                                    <div className={`glass-panel p-8 rounded-3xl rounded-tl-sm text-xl leading-relaxed shadow-2xl border-t border-white/10 ${currentTurn.isCorrect === true ? 'border-green-500/50 bg-green-900/10' : currentTurn.isCorrect === false ? 'border-orange-500/50 bg-orange-900/10' : ''}`}>
                                        {currentTurn.isCorrect === true && <div className="text-green-400 font-bold mb-3 flex items-center gap-2"><Icon name="Star" size={24} /> Phenomenal!</div>}
                                        {currentTurn.isCorrect === false && <div className="text-orange-400 font-bold mb-3 flex items-center gap-2"><Icon name="Brain" size={24} /> Interesting thought... let's pivot!</div>}
                                        <div><MathText text={currentTurn.tutorMessage} /></div>
                                        {currentTurn.visualization && (
                                            <div className="mt-6 flex justify-center items-center w-full">
                                                <CanvasVisualizer code={currentTurn.visualization} />
                                            </div>
                                        )}
                                        {currentTurn.masteryAchieved && <div className="mt-4 p-3 bg-yellow-500/20 text-yellow-300 rounded-xl border border-yellow-500/50 text-sm font-bold flex items-center gap-2">🏆 Module Mastery Achieved!</div>}
                                    </div>

                                    {currentTurn.questionData && currentTurn.questionData.text && !currentTurn.masteryAchieved && (
                                        <div className="bg-slate-800/80 p-8 rounded-3xl border border-slate-700 shadow-inner">
                                            <h3 className="font-bold text-xl mb-6 text-purple-200"><MathText text={currentTurn.questionData.text} /></h3>

                                            {currentTurn.questionData.type === 'multiple_choice' && currentTurn.questionData.options && (
                                                <div className="grid gap-4">
                                                    {currentTurn.questionData.options.map((opt, i) => (
                                                        <button
                                                            key={i}
                                                            onClick={() => handleSubmit(opt)}
                                                            className="text-left p-5 rounded-2xl bg-slate-900/50 border-2 border-slate-700 hover:border-purple-500 hover:bg-slate-800 transition-all font-bold text-lg text-slate-200"
                                                        >
                                                            <MathText text={opt} />
                                                        </button>
                                                    ))}
                                                </div>
                                            )}

                                            {currentTurn.questionData.type === 'free_response' && (
                                                <form onSubmit={(e) => { e.preventDefault(); handleSubmit(inputValue); }} className="relative flex items-center">
                                                    <input
                                                        type="text"
                                                        value={inputValue}
                                                        onChange={(e) => setInputValue(e.target.value)}
                                                        placeholder="Type your brilliant answer here..."
                                                        className="w-full bg-slate-900/50 border-2 border-slate-700 rounded-2xl py-5 px-6 pr-20 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all font-bold text-lg"
                                                        autoFocus
                                                    />
                                                    <button type="submit" disabled={!inputValue.trim()} className="absolute right-3 p-3 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-700 rounded-xl transition-colors text-white shadow-lg">
                                                        <Icon name="Send" size={24} />
                                                    </button>
                                                </form>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        <div ref={chatEndRef} />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [activeNode, setActiveNode] = useState(null);
            const [activeSubject, setActiveSubject] = useState(null);
            // State: Tracks which modules have been successfully mastered
            const [completedNodes, setCompletedNodes] = useState(() => {
                try {
                    const saved = localStorage.getItem('lumina_completedNodes');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            // State: Tracks sub-concept checkpoints within modules: { 'node-id': ['concept 1', 'concept 2'] }
            const [conceptProgress, setConceptProgress] = useState(() => {
                try {
                    const saved = localStorage.getItem('lumina_conceptProgress');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            useEffect(() => {
                localStorage.setItem('lumina_completedNodes', JSON.stringify(completedNodes));
            }, [completedNodes]);

            useEffect(() => {
                localStorage.setItem('lumina_conceptProgress', JSON.stringify(conceptProgress));
            }, [conceptProgress]);

            const handleSelectNode = (node, subject) => {
                setActiveNode(node);
                setActiveSubject(subject);
                setView('learning');
            };

            const handleBackToDashboard = () => {
                setView('dashboard');
                setActiveNode(null);
                setActiveSubject(null);
            };

            const handleMastery = (nodeId) => {
                if (!completedNodes.includes(nodeId)) {
                    setCompletedNodes([...completedNodes, nodeId]);
                }
            };

            const handleConceptMastery = (nodeId, concept) => {
                setConceptProgress(prev => {
                    const current = prev[nodeId] || [];
                    if (!current.includes(concept)) {
                        return { ...prev, [nodeId]: [...current, concept] };
                    }
                    return prev;
                });
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 selection:bg-purple-500/30">
                    {view === 'dashboard' && (
                        <Dashboard
                            onSelectNode={handleSelectNode}
                            completedNodes={completedNodes}
                            onJumpToQuest={handleSelectNode}
                        />
                    )}
                    {view === 'learning' && activeNode && activeSubject && (
                        <LearningInterface
                            node={activeNode}
                            subject={activeSubject}
                            onBack={handleBackToDashboard}
                            onMastery={() => handleMastery(activeNode.id)}
                            completedConcepts={conceptProgress[activeNode.id] || []}
                            onConceptMastery={(concept) => handleConceptMastery(activeNode.id, concept)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
